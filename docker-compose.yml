services:
  db:
    image: postgres:15-alpine
    container_name: cafe_db
    restart: always
    environment:
      POSTGRES_USER: cafe_user
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: cafe_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafe_user -d cafe_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: cafe_app
    restart: always
    environment:
      DATABASE_URL: postgresql://cafe_user:secure_password@db:5432/cafe_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: